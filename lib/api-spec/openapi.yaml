openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: AI chat session management
  - name: ai
    description: AI inference and streaming
  - name: templates
    description: Deployment templates for Ubuntu / nginx / systemd
  - name: notes
    description: Notes operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ai/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all chat sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /ai/sessions/recent:
    get:
      operationId: getRecentSessions
      tags: [sessions]
      summary: Recent sessions with last message preview
      responses:
        "200":
          description: Recent sessions with previews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionPreview"

  /ai/sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session with its messages
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session and all its messages
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /ai/sessions/{sessionId}/messages:
    get:
      operationId: getSessionMessages
      tags: [sessions]
      summary: Get messages for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /ai/chat:
    post:
      operationId: sendChat
      tags: [ai]
      summary: Send a chat message and get a streaming AI response
      description: Returns a non-streaming summary; actual streaming uses /api/ai/stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/models:
    get:
      operationId: listModels
      tags: [ai]
      summary: List available Grok models
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List deployment templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{templateId}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a single deployment template with its file content
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template with content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes
      description: Returns all notes
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      description: Creates a new note and returns it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNote"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note
      description: Returns a single note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      description: Partially updates a note and returns the updated version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNote"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      description: Deletes a note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Session:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        model:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, model, createdAt, updatedAt]

    SessionInput:
      type: object
      properties:
        title:
          type: string
        model:
          type: string
      required: [title]

    SessionPreview:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        model:
          type: string
        lastMessage:
          type: ["string", "null"]
        messageCount:
          type: number
        updatedAt:
          type: string
      required: [id, title, model, messageCount, updatedAt]

    SessionWithMessages:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, title, model, messages, createdAt, updatedAt]

    Message:
      type: object
      properties:
        id:
          type: number
        sessionId:
          type: number
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        toolResults:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, sessionId, role, content, createdAt]

    ChatInput:
      type: object
      properties:
        sessionId:
          type: number
        message:
          type: string
        model:
          type: string
        webSearch:
          type: boolean
      required: [sessionId, message]

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        contextLength:
          type: number
      required: [id, name, contextLength]

    Template:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [nginx, systemd, docker, deploy]
        language:
          type: string
      required: [id, name, description, category, language]

    TemplateDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        language:
          type: string
        content:
          type: string
      required: [id, name, description, category, language, content]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Note:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        body:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
        - updatedAt

    CreateNote:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          nullable: true
      required:
        - title

    UpdateNote:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          nullable: true

    ValidationError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    NotFoundError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
